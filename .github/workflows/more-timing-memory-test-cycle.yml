name: More-timing memory test cycle

on:
  push:
    branches:
      - test/more-timing-memory-tests

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Return captured runner output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spec/tools/expect.lua')
          text = path.read_text()
          old = """  else
    expect.equal('', serr)
  end
end

--[[
"""
          new = """  else
    expect.equal('', serr)
  end
  return sout, serr
end

--[[
"""
          if text.count(old) != 1:
              raise SystemExit('expected one expect.run return anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build and test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            make
            make test
          } 2>&1 | tee test.log
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "Test-cycle result: **$OUTCOME**"
            echo
            echo '```text'
            tail -n 120 test.log
            echo '```'
          } > result.md
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" --body-file result.md
          test "$OUTCOME" = success
