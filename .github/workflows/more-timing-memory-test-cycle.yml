name: More-timing memory test cycle

on:
  push:
    branches:
      - test/more-timing-memory-tests

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Build
        run: make

      - name: Verify the regression test fails without the implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lualib/nelua/runner.lua')
          text = path.read_text()
          block = """    if config.more_timing then
      console.debugf('memory       %.1f KiB', collectgarbage('count'))
    end
"""
          if text.count(block) != 1:
              raise SystemExit('expected one more-timing memory block')
          path.write_text(text.replace(block, '', 1))
          PY

          if make test > red.log 2>&1; then
            echo 'expected the regression test to fail' >&2
            exit 1
          fi
          grep -F 'more timing reports positive memory in KiB' red.log
          git checkout -- lualib/nelua/runner.lua

      - name: Verify the complete test suite
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log

      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "Red-green result: **$OUTCOME**"
            echo
            echo '```text'
            tail -n 120 test.log
            echo '```'
          } > result.md
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" --body-file result.md
          test "$OUTCOME" = success
