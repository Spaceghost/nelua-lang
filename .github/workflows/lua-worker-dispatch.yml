name: Lua worker dispatch chase
on:
  pull_request:
    paths: ['experiments/lua-worker/chase/**', '.github/workflows/lua-worker-dispatch.yml']
permissions:
  contents: read
concurrency:
  group: lua-worker-dispatch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHASE_SET: loading
    defaults:
      run:
        working-directory: experiments/lua-worker
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Bootstrap pinned toolchains
        run: bash scripts/bootstrap.sh 2>&1 | tee bootstrap.log
      - name: Build and gate every architecture contender
        run: timeout --signal=KILL 900s python3 chase/prepare.py 2>&1 | tee reports/chase-build.log
      - name: Validate packed adapter and unbiased JavaScript reference
        run: timeout --signal=KILL 90s node chase/packing.test.mjs 2>&1 | tee reports/packing-tests.txt
      - name: Measure matched dispatch lifetimes and memory
        run: timeout --signal=KILL 900s node chase/run.mjs 2>&1 | tee reports/chase-run.log
      - name: Publish measured summary
        if: always()
        run: |
          if test -f reports/chase/RESULTS.md; then cat reports/chase/RESULTS.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain source and raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lua-dispatch-${{ github.run_id }}
          path: |
            experiments/lua-worker/reports/
            experiments/lua-worker/chase/
            experiments/lua-worker/lifecycle/
            experiments/lua-worker/dist/chase/**/core/
            experiments/lua-worker/dist/chase/**/host/
            experiments/lua-worker/dist/chase/**/lifecycle/
            experiments/lua-worker/dist/chase/**/scripts/build.sh
            experiments/lua-worker/dist/chase/**/child.mjs
            experiments/lua-worker/dist/chase/**/parent.mjs
            experiments/lua-worker/dist/chase/**/bench.capnp
            experiments/lua-worker/dist/chase/**/bounded-helper.mjs
            experiments/lua-worker/dist/chase/**/variant.txt
            experiments/lua-worker/dist/chase/**/reports/
            experiments/lua-worker/dist/chase/**/dist/kernel*
            experiments/lua-worker/dist/chase/manifest.json
            experiments/lua-worker/toolchain.json
            experiments/lua-worker/package-lock.json
          if-no-files-found: error
          retention-days: 30
