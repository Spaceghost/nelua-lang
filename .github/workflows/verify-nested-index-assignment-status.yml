name: verify nested index assignment status

on:
  push:
    branches:
      - verify/index-assignment-nested-status

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Verify and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('spec/analyzer_spec.lua')
          text = path.read_text()
          anchor = '''  expect.analyze_error([[
            local R = @record{}
            function R:__index(x: integer): integer return 0 end
            local r: R
            r[0] = 1
          ]], "cannot assign through `__index` metamethod, use `__atindex` instead")
          '''
          addition = anchor + '''  expect.analyze_error([[
            local V = @record{x: integer}
            local R = @record{}
            function R:__index(x: integer): V return {} end
            local r: R
            r[0].x = 1
          ]], "cannot assign through `__index` metamethod, use `__atindex` instead")
          '''
          if text.count(anchor) != 1:
              raise SystemExit('expected one direct assignment regression anchor')
          path.write_text(text.replace(anchor, addition, 1))
          PY
          setup_status=$?

          test_status=1
          if [ "$setup_status" -eq 0 ]; then
            make CC=gcc && make test CC=gcc
            test_status=$?
          fi

          if [ "$setup_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            state=success
            description='nested __index assignment rejected'
          else
            state=failure
            description="nested __index verification failed (setup=$setup_status test=$test_status)"
          fi

          target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload=$(python - "$state" "$description" "$target_url" <<'PY'
          import json, sys
          print(json.dumps({
              'state': sys.argv[1],
              'description': sys.argv[2][:140],
              'context': 'verification/index-assignment-nested',
              'target_url': sys.argv[3],
          }))
          PY
          )
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload"

          curl --fail-with-body -L \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/git/refs/heads/verify%2Findex-assignment-nested-status'

          test "$state" = success
